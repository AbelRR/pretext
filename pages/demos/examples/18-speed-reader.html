<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pretext: Speed Reader</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0a0a1a; font-family: 'Helvetica Neue', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; }
    .word-display { font-size: 48px; color: #e2e8f0; text-align: center; min-height: 80px; }
    .controls { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 12px; align-items: center; }
    .btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 8px 20px; border-radius: 8px; font-size: 14px; cursor: pointer; }
    .btn:hover { background: #7c8aff; color: #fff; }
    .btn.active { background: #4ade80; color: #0a0a1a; border-color: #4ade80; }
    .wpm { color: #7c8aff; font-size: 18px; font-weight: 600; min-width: 100px; text-align: center; }
    input[type=range] { width: 150px; }
    .progress { position: fixed; top: 0; left: 0; height: 3px; background: #7c8aff; transition: width 0.1s; }
    .context { position: fixed; top: 50%; left: 50%; transform: translate(-50%, 60px); color: #334155; font-size: 14px; max-width: 500px; text-align: center; line-height: 1.6; }
    .hud { position: fixed; bottom: 12px; left: 12px; font-size: 12px; color: rgba(255,255,255,0.2); }
  </style>
  <script type="module" src="./speed-reader.ts"></script>
</head>
<body>
  <div class="progress" id="progress"></div>
  <div class="word-display" id="word"></div>
  <div class="context" id="context"></div>
  <div class="controls">
    <button class="btn" id="play-btn">Play</button>
    <input type="range" id="wpm-slider" min="100" max="800" value="300">
    <span class="wpm" id="wpm-label">300 WPM</span>
  </div>
  <div class="hud">Line-aware chunking via pretext &middot; Never breaks mid-line</div>
</body>
</html>
