<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pretext: Font DJ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0a0a1a; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    canvas { display: block; position: fixed; top: 0; left: 0; }
    .controls { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 12px; align-items: center; }
    .font-btn {
      background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 8px 16px;
      border-radius: 8px; font-size: 13px; cursor: pointer; transition: all 0.2s;
    }
    .font-btn:hover, .font-btn.active { background: #7c8aff; color: #fff; border-color: #7c8aff; }
    .slider-box { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .slider-label { font-size: 11px; color: #475569; }
    input[type=range] { width: 120px; }
    .hud { position: fixed; top: 12px; left: 12px; z-index: 10; font-size: 12px; color: rgba(255,255,255,0.3); pointer-events: none; }
  </style>
  <script type="module" src="./font-dj.ts"></script>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="hud">Switch fonts instantly — pretext re-prepares and re-layouts in real-time</div>
  <div class="controls">
    <button class="font-btn active" data-font="Georgia">Georgia</button>
    <button class="font-btn" data-font="Helvetica Neue">Helvetica</button>
    <button class="font-btn" data-font="Courier New">Courier</button>
    <button class="font-btn" data-font="Times New Roman">Times</button>
    <button class="font-btn" data-font="Arial">Arial</button>
    <div class="slider-box">
      <input type="range" id="size-slider" min="12" max="48" value="20">
      <span class="slider-label" id="size-label">20px</span>
    </div>
  </div>
</body>
</html>
