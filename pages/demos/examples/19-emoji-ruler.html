<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pretext: Emoji Measuring Tape</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0a0a1a; font-family: 'Helvetica Neue', sans-serif; }
    canvas { display: block; position: fixed; top: 0; left: 0; cursor: col-resize; }
    .controls { position: fixed; top: 16px; left: 16px; z-index: 10; display: flex; gap: 8px; flex-wrap: wrap; }
    .text-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }
    .text-btn:hover, .text-btn.active { background: #7c8aff; color: #fff; border-color: #7c8aff; }
    .hud { position: fixed; bottom: 12px; left: 12px; z-index: 10; font-size: 12px; color: rgba(255,255,255,0.25); pointer-events: none; }
  </style>
  <script type="module" src="./emoji-ruler.ts"></script>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="controls">
    <button class="text-btn active" data-idx="0">English</button>
    <button class="text-btn" data-idx="1">Emoji</button>
    <button class="text-btn" data-idx="2">CJK</button>
    <button class="text-btn" data-idx="3">Arabic</button>
    <button class="text-btn" data-idx="4">Mixed</button>
  </div>
  <div class="hud">Move mouse to measure &middot; Pretext measures every script to sub-pixel accuracy</div>
</body>
</html>
