<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pretext: Infinite Scroll</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a1a; font-family: 'Helvetica Neue', sans-serif; color: #e2e8f0; }
    .container { max-width: 600px; margin: 0 auto; padding: 16px; }
    .header { text-align: center; padding: 20px 0; border-bottom: 1px solid #1e293b; margin-bottom: 16px; }
    h1 { font-size: 18px; color: #7c8aff; }
    .stats { font-size: 12px; color: #475569; margin-top: 8px; }
    .viewport { height: calc(100vh - 120px); overflow-y: auto; position: relative; }
    .scroll-content { position: relative; }
    .item { position: absolute; left: 0; right: 0; padding: 12px 16px; border-bottom: 1px solid #1e293b; font: 14px/20px 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .item:nth-child(odd) { background: rgba(255,255,255,0.02); }
    .item .idx { color: #475569; font-size: 11px; margin-bottom: 4px; }
  </style>
  <script type="module" src="./infinite-scroll.ts"></script>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>100,000 Items — Zero Layout Shift</h1>
      <div class="stats" id="stats">Heights pre-computed by pretext</div>
    </div>
    <div class="viewport" id="viewport">
      <div class="scroll-content" id="scroll-content"></div>
    </div>
  </div>
</body>
</html>
