<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pretext: Sticky Notes</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #5c4033; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0;
      background: repeating-conic-gradient(#5a3e2e 0% 25%, #5c4033 0% 50%) 0 0 / 40px 40px;
      opacity: 0.3;
    }
    canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; cursor: grab; touch-action: none; }
    canvas:active { cursor: grabbing; }
    .hud { position: fixed; bottom: 12px; left: 12px; z-index: 10; font-size: 12px; color: rgba(255,255,255,0.4); pointer-events: none; }
    .add-btn {
      position: fixed; top: 16px; right: 16px; z-index: 10; background: #fbbf24; color: #333;
      border: none; padding: 10px 18px; border-radius: 8px; font-size: 14px; font-weight: 600;
      cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.3); -webkit-tap-highlight-color: transparent;
    }
    .add-btn:hover { background: #f59e0b; }
  </style>
  <script type="module" src="./sticky-notes.ts"></script>
</head>
<body>
  <canvas id="canvas"></canvas>
  <button class="add-btn" id="add-btn">+ Add Note</button>
  <div class="hud">Drag to move &middot; Double-click/tap to edit &middot; Text reflows via pretext</div>
</body>
</html>
