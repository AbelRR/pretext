<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pretext: Typography Roulette</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0a0a1a; font-family: sans-serif; }
    canvas { display: block; position: fixed; top: 0; left: 0; }
    .btn { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 10; background: #ff6b6b; color: #fff; border: none; padding: 12px 32px; border-radius: 12px; font-size: 18px; font-weight: 700; cursor: pointer; letter-spacing: 2px; }
    .btn:hover { background: #ef4444; }
    .hud { position: fixed; bottom: 12px; left: 12px; z-index: 10; font-size: 12px; color: rgba(255,255,255,0.25); pointer-events: none; }
  </style>
  <script type="module" src="./typo-roulette.ts"></script>
</head>
<body>
  <canvas id="canvas"></canvas>
  <button class="btn" id="spin-btn">SPIN</button>
  <div class="hud">Spin to change font &middot; Pretext re-prepares and re-layouts instantly</div>
</body>
</html>
