<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pretext: Ransom Note</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #f5f0e8; font-family: sans-serif; }
    canvas { display: block; position: fixed; top: 0; left: 0; }
    .hud { position: fixed; bottom: 12px; left: 12px; z-index: 10; font-size: 12px; color: rgba(0,0,0,0.3); pointer-events: none; }
    .input-box {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 10;
      background: #fff; border: 2px solid #ccc; border-radius: 8px; padding: 8px 16px;
      font-size: 16px; width: 400px; max-width: 90vw; text-align: center;
    }
  </style>
  <script type="module" src="./ransom-note.ts"></script>
</head>
<body>
  <canvas id="canvas"></canvas>
  <input class="input-box" id="input" type="text" value="pretext measures every word perfectly" placeholder="Type a message...">
  <div class="hud">Each word measured with a random font/size by pretext &middot; Tiled seamlessly</div>
</body>
</html>
