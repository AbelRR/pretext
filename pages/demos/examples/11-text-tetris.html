<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pretext: Text Tetris</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0a0a1a; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    canvas { display: block; margin: 0 auto; }
    .hud { position: fixed; top: 16px; right: 16px; z-index: 10; font-size: 14px; color: #7c8aff; text-align: right; }
    .hud .score { font-size: 28px; font-weight: 700; }
    .hud .label { font-size: 11px; color: #475569; text-transform: uppercase; letter-spacing: 1px; }
    .hud2 { position: fixed; bottom: 12px; left: 12px; z-index: 10; font-size: 12px; color: rgba(255,255,255,0.3); pointer-events: none; }
  </style>
  <script type="module" src="./text-tetris.ts"></script>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="hud">
    <div class="label">Score</div>
    <div class="score" id="score">0</div>
    <div class="label" style="margin-top:8px">Lines</div>
    <div class="score" id="lines-cleared">0</div>
  </div>
  <div class="hud2">Arrow keys to move &middot; Blocks sized by pretext &middot; Fill a row to clear</div>
</body>
</html>
