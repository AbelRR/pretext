<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pretext: Paragraph Pinball</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0a0a1a; }
    canvas { display: block; position: fixed; top: 0; left: 0; cursor: pointer; }
    .hud { position: fixed; bottom: 12px; left: 12px; z-index: 10; font-size: 12px; color: rgba(255,255,255,0.25); font-family: sans-serif; pointer-events: none; }
    .score-hud { position: fixed; top: 16px; right: 16px; z-index: 10; font-size: 24px; color: #7c8aff; font-weight: 700; font-family: sans-serif; }
  </style>
  <script type="module" src="./paragraph-pinball.ts"></script>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="score-hud" id="score">0</div>
  <div class="hud">Click to launch ball &middot; Text blocks are bumpers sized by pretext &middot; Hit to reflow</div>
</body>
</html>
