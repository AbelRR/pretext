<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pretext: Text Sorting</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0a0a1a; font-family: sans-serif; }
    canvas { display: block; position: fixed; top: 0; left: 0; }
    .controls { position: fixed; top: 16px; left: 16px; z-index: 10; display: flex; gap: 8px; }
    .btn {
      background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 6px 14px;
      border-radius: 6px; font-size: 13px; cursor: pointer;
    }
    .btn:hover { background: #7c8aff; color: #fff; border-color: #7c8aff; }
    .hud { position: fixed; bottom: 12px; left: 12px; z-index: 10; font-size: 12px; color: rgba(255,255,255,0.3); pointer-events: none; }
  </style>
  
<script type="module" crossorigin src="../15-text-sorting-chvm74pg.js"></script></head>
<body>
  <canvas id="canvas"></canvas>
  <div class="controls">
    <button class="btn" id="sort-btn">Sort by Height</button>
    <button class="btn" id="shuffle-btn">Shuffle</button>
    <button class="btn" id="width-btn">Change Width</button>
  </div>
  <div class="hud">50 text blocks sorted by pretext-computed height &middot; Animated swap visualization</div>
</body>
</html>
