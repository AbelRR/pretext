<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pretext: Concrete Poetry</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0a0a1a; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    canvas { display: block; position: fixed; top: 0; left: 0; }
    .controls { position: fixed; top: 16px; left: 16px; z-index: 10; display: flex; gap: 8px; }
    .shape-btn {
      background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 6px 14px;
      border-radius: 6px; font-size: 13px; cursor: pointer; transition: all 0.2s;
    }
    .shape-btn:hover, .shape-btn.active { background: #7c8aff; color: #fff; border-color: #7c8aff; }
    .hud { position: fixed; bottom: 12px; left: 12px; z-index: 10; font-size: 12px; color: rgba(255,255,255,0.3); pointer-events: none; }
  </style>
  
<script type="module" crossorigin src="../10-concrete-poetry-fvch7a3q.js"></script></head>
<body>
  <canvas id="canvas"></canvas>
  <div class="controls">
    <button class="shape-btn active" data-shape="circle">Circle</button>
    <button class="shape-btn" data-shape="heart">Heart</button>
    <button class="shape-btn" data-shape="wave">Wave</button>
    <button class="shape-btn" data-shape="diamond">Diamond</button>
    <button class="shape-btn" data-shape="spiral">Spiral</button>
  </div>
  <div class="hud">Text shaped by pretext layoutNextLine() with variable widths per line</div>
</body>
</html>
